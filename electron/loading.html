<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Diary</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #0f172a;
      color: #94a3b8;
      font-family: system-ui, -apple-system, sans-serif;
      user-select: none;
      -webkit-app-region: drag;
    }

    .icon {
      font-size: 48px;
      margin-bottom: 24px;
      opacity: 0.85;
    }

    .title {
      font-size: 20px;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 8px;
      letter-spacing: 0.01em;
    }

    .status {
      font-size: 13px;
      color: #475569;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dots {
      display: inline-flex;
      gap: 4px;
    }

    .dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #475569;
      animation: pulse 1.4s ease-in-out infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }

    .bar-wrap {
      margin-top: 32px;
      width: 160px;
      height: 2px;
      background: #1e293b;
      border-radius: 1px;
      overflow: hidden;
    }

    .bar {
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #818cf8);
      border-radius: 1px;
      animation: sweep 1.8s ease-in-out infinite;
    }

    @keyframes sweep {
      0%   { width: 0%; margin-left: 0%; }
      50%  { width: 60%; margin-left: 20%; }
      100% { width: 0%; margin-left: 100%; }
    }
  </style>
</head>
<body>
  <div class="icon">📖</div>
  <div class="title">My Diary</div>
  <div class="status">
    正在启动
    <span class="dots">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </span>
  </div>
  <div class="bar-wrap">
    <div class="bar"></div>
  </div>
</body>
</html>
